{% extends "base.html" %}

{% block content %}
  <div class="error-pagina">
    <span class="error-codigo">{% trans code=502 %}Error {{ code }}{% endtrans %}</span>
    <h1>{{ _("The server is not responding") }}</h1>
    <p>{{ _("Try again in a while. If it keeps happening, tell the CTF organizers.") }}</p>
    <div class="acciones">
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary">{{ _("Back to home") }}</a>
      <a href="{{ url_for('challenges.listing') }}" class="btn btn-sec">{{ _("Go to the challenges") }}</a>
    </div>
  </div>
{% endblock %}
