{% extends "base.html" %}

{% block content %}
  <div class="error-pagina">
    <span class="error-codigo">{% trans code=404 %}Error {{ code }}{% endtrans %}</span>
    <h1>{{ _("We couldn't find this page") }}</h1>
    <p>{{ _("The link may be mistyped, or the page may no longer exist.") }}</p>
    <div class="acciones">
      <a href="{{ url_for('views.static_html', route='/') }}" class="btn btn-primary">{{ _("Back to home") }}</a>
      <a href="{{ url_for('challenges.listing') }}" class="btn btn-sec">{{ _("Go to the challenges") }}</a>
    </div>
  </div>
{% endblock %}
