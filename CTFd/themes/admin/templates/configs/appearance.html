<div role="tabpanel" class="tab-pane config-section active" id="appearance">
	<form method="POST" autocomplete="off" class="w-100">
		<div class="form-group">
			<label for="ctf_name">
				{% trans %}Competition Name{% endtrans %}
				<small class="form-text text-muted">{% trans %}Competition name displayed instead of a logo{% endtrans %}</small>
			</label>
			<input class="form-control" id='ctf_name' name='ctf_name' type='text' placeholder="{% trans %}CTF Name{% endtrans %}"
				   {% if ctf_name is defined and ctf_name != None %}value="{{ ctf_name }}"{% endif %}>
		</div>

		<div class="form-group">
			<label>
				{% trans %}CTF Description{% endtrans %}<br>
				<small class="form-text text-muted">
					{% trans %}Description for the CTF{% endtrans %}
				</small>
			</label>
			<textarea class="form-control" type="text" id="ctf_description" name="ctf_description" rows="5">{{ ctf_description }}</textarea>
		</div>

		<button type="submit" class="btn btn-md btn-primary float-right">{% trans %}Update{% endtrans %}</button>
	</form>
</div>
