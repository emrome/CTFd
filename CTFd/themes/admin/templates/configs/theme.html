<div role="tabpanel" class="tab-pane config-section" id="theme">
	<form id="logo-upload" class="form-upload" method="POST" enctype="multipart/form-data">
		<div class="form-group">
			<label for="ctf_logo">
				Logo
				<small class="form-text text-muted">
					Logo que se usa en el sitio web en lugar del nombre del CTF.
				</small>
			</label>

			{% if ctf_logo %}
				<div class="d-block py-3">
					<img id="ctf_logo_preview" class="img-responsive ctf_logo"
						 src="{{ url_for('views.files', path=ctf_logo) }}"
						 height="80">
					<button type="button" id="remove-logo" class="btn-sm btn-danger">
						Quitar logo
					</button>
				</div>
			{% endif %}

			<div class="row">
				<div class="col-md-9">
					<input class="form-control-file" id="ctf_logo_file" name='file' type='file' accept="image/*" placeholder="Logo del CTF">
				</div>
				<div class="col-md-3">
					<div class="form-group">
						<div class="d-inline-block float-right">
							<button type="submit" class="btn-sm btn-primary float-right">Subir</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</form>

	<form id="ctf-small-icon-upload" class="form-upload" method="POST" enctype="multipart/form-data">
		<div class="form-group">
			<label for="small_icon">
				Ícono chico
				<small class="form-text text-muted">
					<a href='https://en.wikipedia.org/wiki/Favicon' target='_blank'>favicon</a> que se ve en el navegador de los usuarios. Solo se aceptan PNG. Tiene que medir 32x32px.
				</small>
			</label>

			{% if ctf_small_icon %}
				<div class="d-block py-3">
					<img id="ctf_small_icon_preview" class="img-responsive ctf_small_icon"
						 src="{{ url_for('views.files', path=ctf_small_icon) }}"
						 height="32">
					<button type="button" id="remove-small-icon" class="btn-sm btn-danger">
						Quitar ícono
					</button>
				</div>
			{% endif %}

			<div class="row">
				<div class="col-md-9">
					<input class="form-control-file" id="ctf_small_icon_file" name='file' type='file' accept=".png" placeholder="Ícono chico">
				</div>
				<div class="col-md-3">
					<div class="form-group">
						<div class="d-inline-block float-right">
							<button type="submit" class="btn-sm btn-primary float-right">Subir</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</form>

	<hr>

	<div class="modal fade" role="document" id="theme-settings-modal">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Ajustes del tema</h5>
				</div>
				<div class="modal-body">
				{% include ctf_theme + "/config.html" ignore missing %}
				</div>
			</div>
		</div>
	</div>

	<form method="POST" autocomplete="off" class="w-100">
		<div class="form-group">
			<label for="ctf_theme">
				Tema
				<small class="form-text text-muted">
					Cambiá de tema para modificar el aspecto de CTFd
				</small>
			</label>
			<select class="form-control custom-select" id="ctf_theme" name="ctf_theme">
				<option>{{ ctf_theme }}</option>
				{% for theme in themes %}
					<option>{{ theme }}</option>
				{% endfor %}
			</select>
		</div>

		<div class="form-group">
			<label>
				Color del tema
				<small class="form-text text-muted">
					Color que usa el tema para su aspecto. El tema tiene que soportarlo.
				</small>
			</label>
			<div class="d-inline-block">
				<input type="color" id="config-color-picker">
				<button type="button" class="btn-sm btn-primary" id="config-color-update">Actualizar CSS</button>
			</div>
		</div>

		<div class="form-group">
			<label>
				Encabezado del tema
				<small class="form-text text-muted">
					El encabezado del tema se inserta justo antes de la etiqueta <code>&lt;/head&gt;</code> en todas las páginas públicas.
					El tema tiene que soportarlo.
				</small>
			</label>
			<textarea class="form-control" id="theme-header" name="theme_header" rows="7">{{ theme_header or "" }}</textarea>
		</div>

		<div class="form-group">
			<label>
				Pie de página del tema
				<small class="form-text text-muted">
					El pie de página del tema se inserta justo antes de la etiqueta <code>&lt;/body&gt;</code> en todas las páginas públicas.
					El tema tiene que soportarlo.
				</small>
			</label>
			<textarea class="form-control" id="theme-footer" name="theme_footer" rows="7">{{ theme_footer or "" }}</textarea>
		</div>

		<div class="form-group">
			<label for="ctf_theme">
				Ajustes del tema
			</label>
			<div class="d-block pb-2">
				<button type="button" class="btn-sm btn-primary" id="theme-settings-button">
					Editor de ajustes
				</button>
			</div>
			<textarea class="form-control" id="theme-settings" name="theme_settings" rows="7">{{ theme_settings or "" }}</textarea>
			<small class="form-text text-muted">
				Ajustes propios del tema
			</small>
		</div>

		<button type="submit" class="btn btn-md btn-primary float-right">Actualizar</button>
	</form>
</div>
