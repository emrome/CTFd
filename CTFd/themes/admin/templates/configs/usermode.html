<div role="tabpanel" class="tab-pane config-section" id="usermode">
	<form id="user-mode-form" method="POST" autocomplete="off" class="w-100 custom-config-form">
		<div class="form-group">
			<label for="ctf_name">
				Modo de juego
				<small class="form-text text-muted">Define si los usuarios se juntan en equipos para jugar (modo por equipos) o juegan cada uno por su cuenta (modo individual)</small>
			</label>

			<div class="row pt-3">
				<div class="col-md-6">
					<label class="h-100 w-100">
						<input type="radio" class="card-radio d-none" name="user_mode" value="teams" {% if user_mode == 'teams' %}checked{% endif %}>
						<div class="card rounded-0 h-100">
							<div class="card-body p-3">
								<span class="card-title">
									<div class="form-check">
										<input class="form-check-input card-radio-clone" type="radio" style="visibility: hidden;" checked>
										<span class="form-check-label text-center">
											<h5>Modo por equipos</h5>
										</span>
										<ul class="p-0 small">
											<li>Los participantes se registran y arman equipos</li>
											<li>Si un integrante resuelve un desafío, el puntaje es para todo el equipo</li>
											<br>
											<li>Es más fácil ver qué integrante resolvió cada desafío</li>
											<li>Puede ser un poco más difícil de administrar</li>
										</ul>
									</div>
								</span>
							</div>
						</div>
					</label>
				</div>
				<div class="col-md-6">
					<label class="h-100 w-100">
						<input type="radio" class="card-radio d-none" name="user_mode" value="users" {% if user_mode == 'users' %}checked{% endif %}>
						<div class="card rounded-0 h-100">
							<div class="card-body p-3">
								<span class="card-title">
									<div class="form-check">
										<input class="form-check-input card-radio-clone" type="radio" style="visibility: hidden;" checked>
										<span class="form-check-label text-center">
											<h5>Modo individual</h5>
										</span>
										<ul class="p-0 small">
											<li>Cada participante registra solo una cuenta individual</li>
											<li>Los jugadores pueden compartir cuentas para armar pseudoequipos</li>
											<br>
											<li>Es más fácil de organizar</li>
											<li>Es difícil saber qué integrante resolvió cada desafío</li>
										</ul>
									</div>
								</span>
							</div>
						</div>
					</label>
				</div>
			</div>
		</div>

		<div class="alert alert-danger text-center" role="alert">
			<p>
				<strong>Si cambiás el modo de juego, también se borran todos los envíos y registros de acciones de los usuarios.</strong>
				<br><small>(Envíos, premios, desbloqueos, seguimiento)</small>
			</p>
		</div>

		<button type="submit" class="btn btn-md btn-primary float-right">
			Actualizar
		</button>
	</form>
</div>
