<div role="tabpanel" class="tab-pane config-section" id="security">
	{% set html_sanitization = "true" if html_sanitization == True else "false" %}
	<form method="POST" autocomplete="off" class="w-100">
		<div class="form-group">
			<label for="html_sanitization">
				Sanitización de HTML
				<small class="form-text text-muted">
					Define si CTFd intenta sanitizar (limpiar) el HTML del contenido.
				</small>
			</label>
			<select class="form-control custom-select" name="html_sanitization">
				{% if force_html_sanitization %}
				<option value="Required (Disable in config.ini)">
					Obligatoria (se desactiva en config.ini)
				</option>
				{% else %}
				<option value="true" {% if html_sanitization=='true' %}selected{% endif %}>
					Activada
				</option>
				<option value="false" {% if html_sanitization=='false' %}selected{% endif %}>
					Desactivada
				</option>
				{% endif %}
			</select>
		</div>
		<div class="form-group">
			<label for="ctf_name">
				Código de registro
				<small class="form-text text-muted">Código de registro obligatorio para crear una cuenta (no aplica al inicio de sesión único/SSO)</small>
			</label>
			<input class="form-control" id='registration_code' name='registration_code' type='text' placeholder="Código de registro"
				   {% if registration_code is defined and registration_code != None %}value="{{ registration_code }}"{% endif %}>
		</div>

		<button type="submit" class="btn btn-md btn-primary float-right">Actualizar</button>
	</form>
</div>
