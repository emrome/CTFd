hints:
  - { cost: 5, content: "Necesitás una herramienta web. Buscá 'online QR decoder' o 'leer QR desde imagen'." }
  - { cost: 10, content: "Leé con mucha atención el nombre 'mercadolibre' en el link que te dio el decodificador." }
  - { cost: 15, content: "Al dominio le falta una letra. Compara 'mercadolibe' con 'mercadolibre'." }

flags:
