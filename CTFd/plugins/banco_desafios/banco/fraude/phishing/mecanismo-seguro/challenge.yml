category: "Phishing"
value: 70
type: "standard"
state: "visible"
attempts: 0

description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">📧 ➡️ 📱 ➡️ ⁉️ El Ataque de Doble Canal</h4>
  <p>¡Estás bajo ataque! El atacante está intentando robar tu cuenta de Instagram y necesita ese código de 6 dígitos que te llegó por email (<code>alerta.png</code>) para completar el acceso.</p>
  <p>El atacante está enviándote mensajes por SMS (<code>sms_soporte.png</code>) para convencerte de que le entregues esa información, usando la excusa de un falso "agente de soporte".</p>
  <p>Este ataque se dirige a la capa de seguridad más importante de tu cuenta. ¿Cuál es el <b>nombre genérico</b> del sistema de seguridad que el atacante está intentando <b>burlar</b>?</p>
  <p>(Escribí solo la sigla del mecanismo de seguridad, en mayúsculas o minúsculas. Ej: flag{sigla}).</p>
  <hr/>

tags:
  - "nivel: medio"
  - "categoría: phishing"
  - "smishing"
