files:
  - "alerta.png"
  - "sms_soporte.png"

hints:
  - { cost: 10, content: "El email de Instagram es real. El SMS del 'soporte' es falso. La clave está en que es un proceso de seguridad que requiere <b>dos</b> métodos de verificación." }
  - { cost: 20, content: "Busca en Google: 'seguridad que usa dos factores' o 'autenticación con código y contraseña'." }
  - { cost: 40, content: "La sigla es un número y una letra (ej: 3FA o 2FA)." }

flags:
  - { type: "static", content: "flag{2fa}", data: "case_insensitive"}
  - { type: "static", content: "flag{mfa}", data: "case_insensitive"}

requirements:
  - "Bienvenido/a al CTF"
  - "¿Es real o fake?"
  - "Soporte de Netflix"

pedagogy:
  concept: "Comprender ataques de engaño orientados a burlar mecanismos de autenticación"
  challenge_type: "Análisis de una situación de engaño a través de canales múltiples"
