hints:
  - { cost: 1, content: "Lee con atención las frases destinadas a generar presión temporal (plazos, minutos, urgencia)." }
  - { cost: 5, content: "El código falso suele aparecer en la parte donde te piden referenciarlo si contactas al 'soporte'." }
  - { cost: 8, content: "Busca una cadena alfanumérica con guiones que lleve la palabra URGENCIA." }

flags:
