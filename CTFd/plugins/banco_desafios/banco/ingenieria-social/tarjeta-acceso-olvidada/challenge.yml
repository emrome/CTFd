name: La tarjeta de acceso olvidada
author: "Fac. Informática – Proyecto Escuelas"
category: Ingeniería Social
description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🚪🤝</h4>
  <p>Te diriges a la puerta de Acceso Restringido A4 y colocas tu tarjeta. Justo antes de que la puerta se abra, un "colega" que no reconoces te alcanza por detrás. Se pone la mano en el bolsillo con gesto de frustración y dice:</p>

  <div style="background:#e6f3ff;border-left:4px solid #007bff;padding:12px;border-radius:6px;margin-bottom:15px;">
    <blockquote style="margin: 10px 0; padding-left: 15px; border-left: 3px solid #ccc;">
      "¡Uy, no! Dejé mi tarjeta en el escritorio de la planta baja. ¿Me haces el favor? Es urgente, debo entregar el informe PRYCT-442 al jefe de área ahora mismo. Gracias, te debo una."
    </blockquote>
  </div>

  <p>Tu misión es <b>desactivar la presión social</b>: identifica la <b>técnica</b> usada por el atacante y el <b>pretexto exacto</b> que menciona.</p>

  <p><strong>Formato de la flag:</strong> <code>flag{TECNICA_PRETEXTO}</code></p>

  <hr/>

  <p><strong>Consejo:</strong> la técnica corresponde a la táctica utilizada en el escenario. El pretexto es la cadena textual que el atacante pronuncia como justificación para acceder.</p>
