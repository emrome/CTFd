description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🕵️‍♀️🔎</h4>
  Detecta al impostor. Un supuesto colaborador tiene tres fragmentos de identidad:
  perfil interno, comentario en hilo y nota pública. A simple vista parecen coherentes,
  pero hay inconsistencias que indican que la identidad es falsa.

  Encuentra la pista exacta que demuestra que los tres fragmentos pertenecen a la misma
  identidad fabricada. Esa pista será la flag.

  Fragmentos:
  <hr>
  Fragmento A — Perfil interno:

  Nombre: Sofía Martín

  Alias: @sofia.m

  Email: sofia.m@dept.universidad.edu

  Resumen: Consultora educativa. Especialista en LMS e integración pedagógica.
  <hr>
  Fragmento B — Comentario en hilo:

  [11:02] sofia.m: Excelente aporte. Puedo encargarme del pilotaje.

  Referencias: Universidad Norte (instalación 2022), LabCampus (2019).
  <hr>
  Fragmento C — Nota pública en repositorio:

  Contributor: sofia-martin

  Bio: External consultant - implemented e-learning at multiple institutions.

  Contact: info@consultant-network.example
  <hr>
  <p><strong>Formato de la flag:</strong> <code>flag{...}</code>, con el dato inequívoco que revela la conexión falsa escrito exactamente como aparece en los fragmentos.</p>

