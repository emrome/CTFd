description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🕵️‍♂️📡</h4>
  <p>Un agente interceptó una transmisión enemiga. El mensaje es incomprensible. Parece una mezcla aleatoria de letras y números.</p>
  <p>Un intento rápido de aplicar cifrados de desplazamiento (como César) no tiene sentido... ¿cuánto es "4" + 3? No parece que las letras hayan sido <i>cambiadas</i>.</p>
  <p>El analista principal cree que las letras y números son los correctos, pero están <strong>terriblemente desordenados</strong>. Como si el mensaje original se hubiera escrito siguiendo un patrón de <strong>zig-zag</strong> antes de ser transmitido.</p>

  <blockquote style="margin:8px 0;padding:8px;border-left:3px solid #ccc;font-style:italic;">
  P4NC13SM3T_RTCN1010
  </blockquote>

  <p>¿Cuál es el concepto clave que oculta el mensaje?</p>

