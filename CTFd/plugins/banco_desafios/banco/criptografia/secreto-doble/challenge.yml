description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🧪🔐</h4>
  <p>En el laboratorio de la escuela quedaron unas notas de un experimento de comunicación “con dos etapas”.
  Alguien aseguró que el mensaje está intacto, pero “enmascarado” dos veces.</p>

  <blockquote style="margin:8px 0;padding:8px;border-left:3px solid #ccc;font-style:italic;word-break:break-all;">
  aW9kantncmVvaF9mbGl1ZGdyX2Zkc2R2fQ==
  </blockquote>

  <p>Dicen que primero hay que dejar de ver “la mezcla” y recién después ajustar el alfabeto.
  <em>¿Podrás recuperar la forma original?</em></p>

