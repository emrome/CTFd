description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">📣🎓</h4>
  <p>Durante una clase de informática, alguien conectó un micrófono viejo del aula y empezó a probarlo.
  El sonido rebotaba contra las paredes, y lo que debía ser un mensaje claro empezó a distorsionarse como si tuviera eco.</p>

  <blockquote style="margin:8px 0;padding:8px;border-left:3px solid #ccc;font-style:italic;">
  NADASEPIERDENADASEPIERDEENELENELECOECO
  </blockquote>

  <p>El mensaje parece repetirse, pero no está del todo claro...
  <em>¿Podrás descubrir qué se intentaba decir?</em></p>
  <p>Recordar el formato de la bandera: <em>flag{}</em></p>

