description: |
  <h4 style="margin:0 0 8px 0;text-align:center;">🖥️🗒️</h4>
  <p>Después del último examen, el profesor dejó el aula abierta. El pizarrón está lleno de ejercicios complejos de la materia "Sistemas Operativos".</p>
  <p>El ayudante, al revisar el aula, nota que el profesor se esfuerza por recordar sus claves. De hecho, parece que la contraseña del "Aula Digital" está... <strong>demasiado cerca de su computadora</strong>.</p>
  <p>A veces, la vulnerabilidad más grande no es un cifrado complejo, sino un simple descuido.</p>
  <p><em>Las contraseñas no siempre se esconden; a veces están a simple vista.</em></p>
  <p>Observá la imagen <code>escritorio_profesor.png</code> y escribí la contraseña en formato de bandera.</p>

