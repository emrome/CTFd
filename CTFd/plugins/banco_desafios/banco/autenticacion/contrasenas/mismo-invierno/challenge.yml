description: |
  <h4 style="margin:0 0 8px 0;text-align:center;">🗓️🔐🖼️</h4>
  <p>Un atacante encontró la contraseña de 'Marcos' en una filtración del año pasado: <strong><code>Invierno.2024</code></strong></p>
  <p>Intentó usarla para abrir el archivo sensible (<code>auditoria_anual.zip</code>), pero falló. Marcos la cambió.</p>
  <p>Sin embargo, el atacante también encontró un memo interno (<code>memo_politica.txt</code>) con las <strong>nuevas reglas obligatorias</strong> que IT envió este año.</p>
  <p>Al abrir el ZIP, encontró una imagen (<code>siempre-lo-mismo.png</code>) que parece normal. Pero algo cambió dentro de ella.</p>
  <p>El memo parece tener muchas pistas.</p>

