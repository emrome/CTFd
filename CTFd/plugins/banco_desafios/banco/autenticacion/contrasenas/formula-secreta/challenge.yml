description: |
  <h4 style="margin:0 0 8px 0;text-align:center;">🧑‍💼🗂️</h4>
  <p>El administrador de sistemas de la escuela debe crear las cuentas para los nuevos profesores que se incorporan este año. Para "ahorrar tiempo", decidió usar una fórmula estándar para todas las contraseñas temporales.</p>
  <p>Encontraste la nota donde probó su sistema. Analizá los ejemplos que dejó y descubrí el patrón que usó:</p>
  <blockquote>
    "<span>// CLAVES NUEVAS (AÑO 2024)</span><br>
    <span>// Prof. Ana García (agarcia) -> Clave: Aga-2024</span><br>
    <span>// Prof. Martín Jones (mjones) -> Clave: Mjo-2024</span><br>
    <span>// Prof. Sofía Díaz (sdiaz) -> Clave: Sdi-2024</span>"
  </blockquote>
  <p>Justo debajo, hay una nota para la próxima cuenta que debe crear:</p>
  <p><strong>"PENDIENTE: Prof. Nuria López (nlopez) -> Clave: ???"</strong></p>
  <p><em>La eficiencia de un administrador puede ser la vulnerabilidad de todos.</em></p>
  <p>Descubrí la contraseña para la profesora Nuria López y escribila en formato de bandera.</p>

