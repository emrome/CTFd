name: "Tu primera clave"
author: "Fac. Informática – Proyecto Escuelas"
category: "Autenticación"

description: |
  <h4 style="margin:0 0 8px 0;text-align:center;">🔐</h4>
  <p>Martín no puede ocultar cuánto quiere a su gato. En su perfil hay fotos, publicaciones y hasta chistes con el mismo nombre.
  Dice que eligió una contraseña “que nunca olvidaría”. Y tiene razón: no la olvida… pero cualquiera que mire su perfil podría adivinarla.</p>
  <p><em>A veces, lo que más nos gusta es también lo que menos deberíamos usar como clave.</em></p>

  <p>Nota: el archivo profile.html contiene el perfil simulado de Martín. Debes obtener la contraseña del archivo secreto.zip para obtener la bandera (flag)</p>

