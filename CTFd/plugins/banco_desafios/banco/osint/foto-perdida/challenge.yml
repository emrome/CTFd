description: |
  <h4 style="margin:0 0 8px 0;text-align:center;">📸🌎</h4>
  <p>Una amiga compartió esta foto en redes, contando que la tomó en el sur del país, durante sus vacaciones.</p>
  <p>Sin embargo, algunos detalles del entorno —la arquitectura, el clima y el tipo de paisaje— parecen no coincidir con su relato.</p>
  <p>Si alguien curioso decide investigar un poco más, podrá descubrir que la imagen pertenece a un lugar muy distinto del que ella mencionó.</p>
  <p>¿Podés averiguar en qué país fue tomada realmente?</p>

