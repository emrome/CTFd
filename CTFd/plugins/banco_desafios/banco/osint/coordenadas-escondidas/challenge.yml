description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">📸 ➡️ 🗺️ ➡️ 📍</h4>
  <p>Un fotógrafo anónimo filtró esta imagen en un foro: <code>foto_misteriosa.jpg</code></p>
  <p>La foto en sí misma no parece tener nada de especial. Pero el fotógrafo dejó un mensaje intrigante:</p>
  <blockquote>“La información no está en lo que ves, sino en lo que no ves. El archivo mismo es el mapa.”</blockquote>
  <p>Quizás la clave no esté en observar la imagen, sino en examinar el <b>archivo digital</b> y lo que guarda en su interior.</p>
  <p>Usando las herramientas correctas, ¿podés descubrir las <b>siglas</b> de la famosa institución científica donde se tomó esta foto?</p>
  <hr/>
  <p>💡 En muchas investigaciones OSINT y forenses, las fotos pueden contener datos ocultos conocidos como <b>metadatos</b>: información sobre el dispositivo, la fecha e incluso la ubicación GPS. Saber cómo leerlos es una habilidad clave para cualquier investigador digital.</p>

