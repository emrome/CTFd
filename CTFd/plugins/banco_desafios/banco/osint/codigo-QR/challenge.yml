hints:
  - { cost: 10, content: "No necesitás escanearlo con el celular. Hay formas de leer un QR desde una imagen usando tu computadora." }
  - { cost: 20, content: "Buscá herramientas o sitios web que te permitan “leer un código QR desde una imagen”. No hace falta instalar nada." }
  - { cost: 30, content: "Probá subir la imagen del cartel a un lector de QR online y observá con atención el texto que aparece: ¿parece ser un enlace real o algo que alguien copió por error?" }

