description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🤳🔗❓</h4>
  <p>La escuela secundaria N° 14 está organizando su kermesse de fin de año y colgaron este cartel en el pasillo.</p>
  <p>El código QR supuestamente lleva al cronograma del evento, pero el organizador se equivocó al crearlo... y sin querer pegó un texto que no debía compartir públicamente.</p>
  <p>Tu celular se quedó sin batería, pero eso no debería frenarte. ¿Podés encontrar <b>otra forma de leer el código QR</b> y descubrir qué información se filtró por error?</p>
  <hr/>
  <p>Recordá que un código QR no siempre contiene un enlace: también puede incluir texto, direcciones de correo, mensajes o incluso contraseñas. Analizá con atención qué tipo de dato aparece al leerlo.</p>
  <hr/>

