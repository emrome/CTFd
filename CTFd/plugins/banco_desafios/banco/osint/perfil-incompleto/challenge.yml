description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">👤➡️💻➡️🔍</h4>
  <p>Un usuario bajo el alias <b>‘C0d3r1n’</b> se volvió conocido en comunidades de programación por resolver desafíos complejos y compartir código de gran nivel.</p>
  <p>El equipo organizador de una competencia quiere contactarlo para invitarlo a una charla, pero nadie conoce su <b>nombre real</b>.</p>
  <p>Durante la búsqueda, se encontraron varias huellas digitales: publicaciones en redes, fragmentos de un blog técnico y un documento público con los resultados de un certamen.</p>
  <p>¿Podés conectar los puntos y descubrir el <b>nombre y apellido</b> de ‘C0d3r1n’? Formato: flag{Nombre_Apellido}</p>
  <hr/>
  <p>💡 En las investigaciones OSINT, la clave suele estar en relacionar datos aparentemente inconexos. Nombres, fechas, alias o menciones cruzadas pueden revelar mucho más de lo que parece.</p>


