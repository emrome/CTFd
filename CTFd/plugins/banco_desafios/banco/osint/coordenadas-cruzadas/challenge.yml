hints:
  - { cost: 10, content: "Si algo parece demasiado obvio, probablemente sea una pista falsa. Mirá más allá de lo que la persona dice en la publicación." }
  - { cost: 30, content: "Fijate si hay algún texto, cartel o símbolo que use un idioma que no sea portugués. Eso puede cambiar por completo la ubicación." }
  - { cost: 40, content: "Si notás que aparecen caracteres de otro alfabeto, buscá países o regiones donde el portugués y ese idioma convivan oficialmente." }


