description: |
  <h4 style="margin:0 0 10px 0;text-align:center;">🇵🇹 ... 🇨🇳 ?</h4>
  <p>Un compañero de la escuela, que siempre exagera un poco sus historias, está de viaje y acaba de subir esta foto.</p>
  <p>El texto del posteo dice: <b>“¡Al fin en Lisboa! No puedo creer lo lindas que son las calles 🇵🇹”</b></p>
  <p>Sin embargo, algo no cierra. La arquitectura y los adoquines son portugueses, pero si mirás con <i>mucho</i> detenimiento los carteles de las tiendas... hay algo que no encaja con Lisboa.</p>
  <p>¿Podés descubrir en qué ciudad está realmente?</p>
  <hr/>
  <p>💡 En las investigaciones OSINT, las fotos pueden mentir: los detalles ayudan a ubicar el lugar exacto. No te quedes solo con lo que dice la publicación.</p>


