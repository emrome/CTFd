<label>
	Estática<br>
	<small>Ingresá el texto exacto de la flag</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">Distingue mayúsculas</option>
		<option value="case_insensitive" {% if data %}selected{% endif %}>No distingue mayúsculas</option>
	</select>
</div>
<input type="hidden" name="type" value="static">
<input type="hidden" name="id" value="{{ id }}">
<hr>
<div class="form-group">
	<button class="btn btn-success float-right">Actualizar</button>
</div>
