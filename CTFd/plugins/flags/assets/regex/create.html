<label>
	Flag regex<br>
	<small>Ingresá la flag como expresión regular</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">Distingue mayúsculas</option>
		<option value="case_insensitive">No distingue mayúsculas</option>
	</select>
</div>
<div class="form-group">
	<label>Ejemplos</label>
	<table class="table small">
		<thead>
			<tr>
				<th scope="col">Descripción</th>
				<th scope="col">Flag</th>
			</tr>
		</thead>
		<tr>
			<td>Aceptar cualquier contenido dentro de flag{}:</td>
			<td><code>flag{.*}</code></td>
		</tr>
		<tr>
			<td>Aceptar flags numéricas:</td>
			<td><code>flag{(\d+)}</code></td>
		</tr>
		<tr>
			<td>Aceptar flags con o sin el prefijo del formato de flag:</td>
			<td><code>(flag{)?this_is_a_flag(})?</code></td>
		</tr>
	</table>
</div>
<input type="hidden" name="type" value="regex">
