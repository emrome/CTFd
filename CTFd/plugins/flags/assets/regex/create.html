<label>
	{{ _("Regex Flag") }}<br>
	<small>{{ _("Enter regex flag data") }}</small>
</label>
<div class="form-group">
	<input type="text" class="form-control" name="content" value="{{ content }}">
</div>
<div class="form-group">
	<select class="form-control custom-select col-md-6" name="data">
		<option value="">{{ _("Case Sensitive") }}</option>
		<option value="case_insensitive">{{ _("Case Insensitive") }}</option>
	</select>
</div>
<div class="form-group">
	<label>{{ _("Examples") }}</label>
	<table class="table small">
		<thead>
			<tr>
				<th scope="col">{{ _("Description") }}</th>
				<th scope="col">Flag</th>
			</tr>
		</thead>
		<tr>
			<td>{{ _("Match any content inside of flag{}:") }}</td>
			<td><code>flag{.*}</code></td>
		</tr>
		<tr>
			<td>{{ _("Match numeric flags:") }}</td>
			<td><code>flag{(\d+)}</code></td>
		</tr>
		<tr>
			<td>{{ _("Accept flags with or without the flag format prefix:") }}</td>
			<td><code>(flag{)?this_is_a_flag(})?</code></td>
		</tr>
	</table>
</div>
<input type="hidden" name="type" value="regex">
