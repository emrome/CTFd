{% extends "admin/challenges/update.html" %}

{% block value %}
<div class="form-group">
	<label for="value">Puntaje actual<br>
		<small class="form-text text-muted">
			Es la cantidad de puntos que vale el desafío en este momento.
		</small>
	</label>
	<input type="number" class="form-control chal-value" name="value" value="{{ challenge.value }}" disabled>
</div>

<div class="form-group">
	<label for="value">Puntaje inicial<br>
		<small class="form-text text-muted">
			Es la cantidad de puntos que valía el desafío al principio.
		</small>
	</label>
	<input type="number" class="form-control chal-initial" name="initial" value="{{ challenge.initial }}" required>
</div>

<div class="form-group">
	<label for="value">Función de decaimiento<br>
		<small class="form-text text-muted">
			<span>Cómo se calcula el puntaje dinámico a partir del valor de decaimiento</span>
			<ul>
				<li>Lineal: se calcula como <code>Initial - (Decay * SolveCount)</code></li>
				<li>Logarítmica: se calcula como <code>(((Minimum - Initial) / (Decay^2)) * (SolveCount^2)) + Initial</code></li>
			</ul>
		</small>
	</label>
	<select name="function" class="custom-select">
		<option value="linear" {% if challenge.function == "linear" %}selected{% endif %}>Lineal</option>
		<option value="logarithmic" {% if challenge.function == "logarithmic" %}selected{% endif %}>Logarítmica</option>
	</select>
</div>

<div class="form-group">
	<label for="value">Decaimiento<br>
		<small class="form-text text-muted">
			<span>El valor de decaimiento se usa de forma distinta según la función de decaimiento elegida arriba</span>
			<ul>
				<li>Lineal: la cantidad de puntos que se descuentan por cada resolución. Se descuenta lo mismo en cada resolución.</li>
				<li>Logarítmica: la cantidad de resoluciones hasta que el desafío llega a su puntaje mínimo. Las primeras resoluciones pierden menos puntos. Las últimas resoluciones pierden más puntos.</li>
			</ul>
		</small>
	</label>
	<input type="number" class="form-control chal-decay" min="1" name="decay" value="{{ challenge.decay }}" required>
</div>

<div class="form-group">
	<label for="value">Puntaje mínimo<br>
		<small class="form-text text-muted">
			Es el puntaje más bajo que puede llegar a valer el desafío
		</small>
	</label>
	<input type="number" class="form-control chal-minimum" name="minimum" value="{{ challenge.minimum }}" required>
</div>
{% endblock %}
